<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КПК BeamNG RP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            background-color: var(--tg-theme-secondary-bg-color, #212d3b);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            color: var(--tg-theme-link-color, #64b5ef);
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .info-group {
            margin-bottom: 15px;
        }

        .label {
            font-size: 12px;
            color: #8e8e93;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .value {
            font-size: 16px;
            font-weight: 500;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        .status-clear {
            background-color: #2e7d32;
            color: #ffffff;
        }

        .status-wanted {
            background-color: #c62828;
            color: #ffffff;
        }

        button {
            width: 100%;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>📱 КПК / Удостоверение</h2>
        
        <div class="info-group">
            <div class="label">Имя и Фамилия (RP):</div>
            <div class="value" id="rp-name">Загрузка...</div>
        </div>

        <div class="info-group">
            <div class="label">Звание / Организация:</div>
            <div class="value" id="faction-rank">Загрузка...</div>
        </div>

        <div class="info-group">
            <div class="label">Статус розыска:</div>
            <div class="value"><span id="wanted-status" class="badge status-clear">Загрузка...</span></div>
        </div>

        <button onclick="Telegram.WebApp.close()">Закрыть КПК</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;

        if (user) {
            document.getElementById('rp-name').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
            document.getElementById('faction-rank').innerText = "Гражданский";
            
            const wantedBadge = document.getElementById('wanted-status');
            wantedBadge.innerText = "Не разыскивается";
            wantedBadge.className = "badge status-clear";
        } else {
            document.getElementById('rp-name').innerText = "Тестовый Посетитель";
            document.getElementById('faction-rank').innerText = "Гость";
            document.getElementById('wanted-status').innerText = "Нет данных";
        }
    </script>
</body>
</html>
