<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RP Tablet</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .app-window { display: none; background: #2c3e50; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 10px; cursor: pointer; border: none; border-radius: 5px; }
        .btn-action { background: #3498db; color: white; }
    </style>
</head>
<body>

    <div id="main-menu">
        <button onclick="showApp('app-passport')">👤 Паспорт</button>
        <button onclick="showApp('app-family')">💰 Семья</button>
        <button onclick="showApp('app-calc')">🧮 Калькулятор</button>
    </div>

    <!-- Паспорт -->
    <div id="app-passport" class="app-window">
        <h3>Мой паспорт</h3>
        <div id="passport-data">Загрузка...</div>
        <button onclick="hideAll()">Закрыть</button>
    </div>

    <!-- Семья -->
    <div id="app-family" class="app-window">
        <h3>Казна: <span id="fam-bal">0</span>€</h3>
        <input type="number" id="amt" placeholder="Сумма">
        <button onclick="famAction('deposit')">Внести</button>
        <div id="tx-list"></div>
        <button onclick="hideAll()">Закрыть</button>
    </div>

    <!-- Калькулятор -->
    <div id="app-calc" class="app-window">
        <input type="text" id="calc-scr" readonly style="width: 100%; height: 40px; margin-bottom: 10px;">
        <div class="grid">
            <button onclick="c('1')">1</button><button onclick="c('2')">2</button>
            <button onclick="c('+')">+</button><button onclick="res()">=</button>
            <button onclick="document.getElementById('calc-scr').value=''">C</button>
        </div>
        <button onclick="hideAll()">Закрыть</button>
    </div>

    <script>
        const API = "http://127.0.0.1:8000";
        const uid = 7914481551; // Ваш ID

        function showApp(id) { document.querySelectorAll('.app-window').forEach(el => el.style.display='none'); document.getElementById(id).style.display='block'; }
        function hideAll() { document.querySelectorAll('.app-window').forEach(el => el.style.display='none'); }
        
        function c(v) { document.getElementById('calc-scr').value += v; }
        function res() { document.getElementById('calc-scr').value = eval(document.getElementById('calc-scr').value); }

        async function famAction(type) {
            let val = document.getElementById('amt').value;
            await fetch(`${API}/api/family_action`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: uid, amount: parseInt(val), action_type: type, description: "Взнос"})
            });
            loadData();
        }

        async function loadData() {
            let res = await fetch(`${API}/api/get_data?user_id=${uid}`);
            let d = await res.json();
            document.getElementById('passport-data').innerHTML = d.user ? `${d.user[1]} ${d.user[2]}<br>Код: ${d.user[4]}` : "Нет данных";
            document.getElementById('fam-bal').innerText = d.fam_balance;
        }
        loadData();
    </script>
</body>
</html>
